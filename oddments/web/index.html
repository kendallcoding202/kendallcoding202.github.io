<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Only this game's own files may run or load. No inline or remote script, no eval, and no network at all:
     there is no connect-src, so the page cannot call anything, anywhere. (capacitor://localhost is the game's
     own files again: it is the address they have inside the iOS app.) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' capacitor://localhost; style-src 'self' capacitor://localhost; img-src 'self' capacitor://localhost; font-src 'self' capacitor://localhost; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17132e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clutterkin">
<meta name="robots" content="noindex">
<meta name="description" content="Clutterkin: befriend the things in the house that came alive.">
<title>Clutterkin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- The loading screen: a postcard of the lane, painted from the game's own art by tools/postcard.mjs. The
     iOS app's launch image is the same picture, so the one becomes the other without a jump. -->
<div id="boot">
  <img class="bootscene" src="assets/boot/lane.webp" alt="">
  <i class="bootfly"></i><i class="bootfly"></i><i class="bootfly"></i><i class="bootfly"></i><i class="bootfly"></i><i class="bootfly"></i><i class="bootfly"></i>
  <div class="boothead">
    <h1 class="boottitle" aria-label="Clutterkin"><span>C</span><span>l</span><span>u</span><span>t</span><span>t</span><span>e</span><span>r</span><span>k</span><span>i</span><span>n</span></h1>
    <p class="boottag">The house is awake.</p>
  </div>
  <div class="bootfoot">
    <p id="bootline">The house is waking up…</p>
    <div class="bootbar"><i id="bootfill"></i></div>
  </div>
</div>

<div id="app" hidden>
  <main id="screen"></main>
  <nav id="tabs" hidden></nav>
</div>

<div id="toasts"></div>
<div id="modals"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
