# Clutterkin: tries the app on an iPhone Duo in Apple's Simulator.
#
#   Run it by hand: Actions tab -> Clutterkin on iPhone Duo -> Run workflow.
#
#   iPhone Duo is Apple's folding iPhone: a 5.4-inch screen closed, a 7.6-inch
#   one open. An app fills all of both only when it is built with an Xcode new
#   enough to know the phone, so this job runs on GitHub's Xcode 27 Mac, not
#   the one the other iOS jobs use. It builds the app unsigned, starts an
#   iPhone Duo in the Simulator, launches the game and keeps screenshots.
#   The simulator starts with the phone shut, so what is seen is the outer
#   screen; nothing a script can do opens it (see the last step).
#
#   It needs no secrets, signs nothing and uploads nothing. Whatever it finds
#   out about the tools (which Xcode, which simulators, how a fold is asked
#   for) it prints, because none of that could be known in advance.
name: Clutterkin on iPhone Duo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oddments-duo
  cancel-in-progress: true

defaults:
  run:
    working-directory: oddments

jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      BUNDLE_ID: app.oddments.game # a stand-in: fine for the Simulator, never uploaded
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oddments/package-lock.json
      - run: npm ci
      - name: Copy the game into the Xcode project
        run: |
          printf "export const BUILD = '%s';\n" "duo-${{ github.run_number }}" > web/js/platform/build.js
          npm run ios:sync
      - name: Show the tools, and whether they know iPhone Duo
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true
          echo "--- kinds of simulator that mention Duo or fold"
          xcrun simctl list devicetypes | grep -iE "duo|fold" || echo "(none)"
          echo "--- simulators already set up that mention Duo or fold"
          xcrun simctl list devices available | grep -iE "duo|fold" || echo "(none)"
          echo "--- iOS versions the Simulator can run"
          xcrun simctl list runtimes | grep -i "ios" || true
          echo "--- what simctl says about displays, folding and poses (all of its help is kept with the screenshots)"
          { xcrun simctl help io; xcrun simctl help ui; xcrun simctl help; } > duo-simctl-help.txt 2>&1 || true
          grep -iE "fold|pose|hinge|display|posture|screenConfig" duo-simctl-help.txt || echo "(nothing)"
      - name: Build for the Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 40
      - name: Find or make an iPhone Duo
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          found = [d for runtime in json.load(sys.stdin)['devices'].values() for d in runtime if 'duo' in d['name'].lower()]
          print(found[-1]['udid'] if found else '')")
          if [ -z "$DEVICE" ]; then
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          found = [t for t in json.load(sys.stdin)['devicetypes'] if 'duo' in t['name'].lower()]
          print(found[-1]['identifier'] if found else '')")
            if [ -z "$TYPE" ]; then
              echo "::error::This Xcode has no iPhone Duo simulator. See the step above for what it does have."
              exit 1
            fi
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          found = [r for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS')]
          print(found[-1]['identifier'] if found else '')")
            echo "making an iPhone Duo: $TYPE on $RUNTIME"
            DEVICE=$(xcrun simctl create "Clutterkin Duo" "$TYPE" "$RUNTIME")
          fi
          xcrun simctl list devices | grep "$DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Launch the game on it and take screenshots
        run: |
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 30
          echo "--- the displays this simulator has"
          xcrun simctl io "$DEVICE" enumerate 2>&1 | grep -iE "display|screen|size|class|port" | head -n 60 || true
          # An iPhone Duo has two screens, and a screenshot has to say which. Asked for one without
          # saying, simctl refuses and lists them ("--display=1 ... 1398x2034"): that list is read here.
          SCREENS=$(xcrun simctl io "$DEVICE" screenshot duo-probe.png 2>&1 | grep -oE -- '--display=[0-9]+ .*' || true)
          rm -f duo-probe.png
          echo "$SCREENS"
          if [ -z "$SCREENS" ]; then
            xcrun simctl io "$DEVICE" screenshot duo-only-screen.png
          else
            echo "$SCREENS" | while read -r line; do
              id=$(echo "$line" | grep -oE '^--display=[0-9]+' | cut -d= -f2)
              size=$(echo "$line" | grep -oE '[0-9]+x[0-9]+$')
              xcrun simctl io "$DEVICE" screenshot --display="$id" "duo-screen-$id-$size.png" || true
            done
            # The simulator starts with the phone shut, and its inner screen dark. Nothing in simctl
            # opens it: switching the inner screen's power on (io screenConfig power) leaves it blank,
            # and switching the outer one off and on only restarts the display. Opening it is done by
            # hand in the Simulator app, which a script on a rented Mac cannot reach.
          fi
          python3 - <<'PY'
          import glob, struct
          for path in sorted(glob.glob("duo-*.png")):
              with open(path, "rb") as f:
                  head = f.read(24)
              print(path, "is %d x %d pixels" % struct.unpack(">II", head[16:24]))
          PY
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$DEVICE" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: oddments-duo-screenshots
          path: |
            oddments/duo-*.png
            oddments/duo-*.txt
          if-no-files-found: warn
