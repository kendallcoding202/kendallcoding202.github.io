ake the data, get gone — and keep the trail cold. Heat leads to me, and I don't get caught. Neither do you.",winText:"THE BROKER: Clean. The buyer's happy, you're paid, and nobody knows you exist. That's the whole art of it. Same time next quarter.",bustedText:"The trace resolved to a face. Yours. The Broker's number is already dead, and a van is already outside. Ghosts don't get caught — you weren't a ghost.",antagonist:{name:"KADE // CORP SECURITY",lines:["Security note: anomalous access flagged on a low-value host. Probably nothing. I flag everything.","It wasn't nothing. Same hand, a rung higher. You're methodical — and methodical people leave patterns.","I've run your pattern against three prior incidents. Someone hired you. I'm going to enjoy finding out who.","You're near the executive tier now. Every door from here logs a face. I already have most of yours.","So it's the vault you wanted. I'm standing in it, watching you knock. Come ahead — the Broker can't buy you out of this room."]},...ba("ghost",Gu,{P:{title:"Warm-up: a competitor's box",blurb:"A soft target on a home line to see if you're worth the rate.",systemKey:"homeServer",reward:20},Q:{title:"A rival's mail server",blurb:"An under-patched inbox. Quiet, easy, and it maps the org for you.",systemKey:"homeServer",reward:20},A:{type:"event",title:"The Broker's tip-off",blurb:"'A tool fell off a truck. Yours for a price — or walk in loud, your call.'",choices:[{label:"Buy the zero-day (25cr)",outcome:"A one-shot exploit lands in your kit.",cost:25,requiresCredits:25,addCard:"zeroDay"},{label:"Pass — stay lean",outcome:"You keep your credits and your low profile.",heat:-4}]},B:{title:"The payroll skim",blurb:"A mid-size firm moves money at 2AM. Slip in and lift the ledger.",systemKey:"smallBusiness",reward:30},C:{title:"The law firm (loud, lucrative)",blurb:"Privileged files, a nervous IT team, and a fat payout for the risk.",systemKey:"smallBusiness",reward:40},D:{type:"safehouse",title:"Lie low",blurb  Cute. We've buried bigger stories under smaller graves. Ask the town.","Legal has your handle. Security has your metadata. One more door and you stop being a nuisance and start being a liability.","The boardroom. Of course. Nobody leaves that room with anything but a settlement or a sentence. Choose carefully."]},...ba("daylight",Gu,{P:{title:"The shell company's site",blurb:"A paper-thin front hides the money. Start where they're careless.",systemKey:"homeServer",reward:18},Q:{title:"A staffer's home router",blurb:"One employee works from home with the door wide open. Walk in.",systemKey:"homeServer",reward:18},A:{type:"event",title:"An insider makes contact",blurb:"'I can weaken one lock for you — but if you take my help, they'll know someone talked.'",choices:[{label:"Take the help (+heat, +tool)",outcome:"A social-engineering angle opens up — but you're both exposed.",heat:10,addCard:"socialEngineer"},{label:"Protect them — go it alone",outcome:"You leave them out of it. Harder, but clean.",heat:-6}]},B:{title:"The fixer's laptop",blurb:"The man who buys the silence keeps the receipts on his own machine. Arrogant. Exploitable.",systemKey:"smallBusiness",reward:28},C:{title:"The compliant newspaper",blurb:"They killed the story once. Their CMS names who ordered it spiked — but the SOC watches in real time, and the trace only speeds up.",systemKey:"liveOps",reward:38},D:{type:"event",title:"Signal boost",blurb:"The collective offers gear from the war chest.",choices:[{label:"Grab a stealth kit (20cr)",outcome:"Tools to keep you quiet on the big one.",cost:20,requiresCredits:20,addCard:"feint"},{label:"Scrub a weak card instead",outcome:"You trim dead weight from your kit.",removeCard:!0}]},E:{type:"safehouse",title:"Signal goes quiet",blurb:"The collective pulls you off the grid to cool down. The trace loses the thread.",heatRelief:22},F:{title:"Corporate legal servers",blurb:"Where the cover-up lives, cross-referenced and dated. Multi-layered and watched.",systemKey:"corpNetwork",reward:44},G:{title:"The PR firm's archive",blurb:"The spin doctors kept every draft of every lie. Damning, and lightly guarded.",systemKey:"corpNetwork",reward:42},Z:{title:"The boardroom archive",blurb:"The top-floor drive: the emails, the transfers, the names, behind everything money can bolt on. Crack it and the whole thing sees daylight.",systemKey:"blackSite",reward:75}})},{id:"burn",name:"Burn Notice",tagline:"You did the big job · now you run",premise:"One score too far, and now everyone wants your head. Every breach is a step toward the exit — and the trace is already climbing. Heat is your enemy here.",handler:"You, alone",heatMax:78,intro:"The job worked. That's the problem. Your buyer flipped, your crew's gone, and a very well-funded trace is already warm. You need papers, a wire, and a way out of the country — before the number under your alias hits zero.",winText:"The plane lifts off a private strip under a name that doesn't exist. Below, a search grid closes on a person who is no longer there. You were never here. You were never anyone. Clean exit.",bustedText:"The trace caught up at the worst moment — a frozen account, a flagged passport, a knock at the door. There's no next breach. Just the sound of the lock, from the wrong side.",antagonist:{name:"THE TRACE",lines:["There you are. You wiped the alias — that's how I knew which alias to wipe toward. Amateurs delete. Ghosts never existed.","Papers, a face, a way out. Predictable. I've caught nine of you doing exactly this. They all ran the same direction.","Your buyer gave you up for less than you'd think. Everyone does. Keep moving — the moving is the part I can follow.","You're reaching for money now. Money has my name on the alerts. Every account you touch, I get warmer.","The border. The last stupid hope of every runner. I'm already through it, holding the door from the far side. Run faster."]},...ba("burn",Sm,{P:{title:"Kill your old alias",blurb:"Your burned identity is still
