[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wageproof"
version = "0.1.0"
description = "Check a Davis-Bacon certified payroll before you file it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
wageproof = "wageproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["wageproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
