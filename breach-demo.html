ake the data, get gone — and keep the trail cold. Heat leads to me, and I don't get caught. Neither do you.",winText:"THE BROKER: Clean. The buyer's happy, you're paid, and nobody knows you exist. That's the whole art of it. Same time next quarter.",bustedText:"The trace resolved to a face. Yours. The Broker's number is already dead, and a van is already outside. Ghosts don't get caught — you weren't a ghost.",antagonist:{name:"KADE // CORP SECURITY",lines:["Security note: anomalous access flagged on a low-value host. Probably nothing. I flag everything.","It wasn't nothing. Same hand, a rung higher. You're methodical — and methodical people leave patterns.","I've run your pattern against three prior incidents. Someone hired you. I'm going to enjoy finding out who.","You're near the executive tier now. Every door from here logs a face. I already have most of yours.","So it's the vault you wanted. I'm standing in it, watching you knock. Come ahead — the Broker can't buy you out of this room."]},...Ta("ghost",Hu,{P:{title:"Warm-up: a competitor's box",blurb:"A soft target on a home line to see if you're worth the rate.",systemKey:"homeServer",reward:20},Q:{title:"A rival's mail server",blurb:"An under-patched inbox. Quiet, easy, and it maps the org for you.",systemKey:"homeServer",reward:20},A:{type:"event",title:"The Broker's tip-off",blurb:"'A tool fell off a truck. Yours for a price — or walk in loud, your call.'",choices:[{label:"Buy the zero-day (25cr)",outcome:"A one-shot exploit lands in your kit.",cost:25,requiresCredits:25,addCard:"zeroDay"},{label:"Pass — stay lean",outcome:"You keep your credits and your low profile.",heat:-4}]},B:{title:"The payroll skim",blurb:"A mid-size firm moves money at 2AM. Slip in and lift the ledger.",systemKey:"smallBusiness",reward:30},C:{title:"The law firm (loud, lucrative)",blurb:"Privileged files, a nervous IT team, and a fat payout for the risk.",systemKey:"smallBusiness",reward:40},D:{type:"safehouse",title:"Lie low",blurb
