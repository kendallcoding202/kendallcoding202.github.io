85}})},{id:"daylight",name:"Daylight",tagline:"Expose the rot · burn it down",premise:"You run with a collective that drags the powerful into the light. The targets are villains. The risk is the same. The point is the leak.",handler:"The Collective",heatMax:98,intro:"COLLECTIVE: They poisoned a town and bought the silence. Work up the chain — shell company, to the fixer, to the men at the top — and dump it all into daylight.",winText:"COLLECTIVE: It's live. Every outlet, every feed, the whole filthy paper trail. They can't sue the sunrise. You didn't just breach a system — you broke a story. Go dark and stay proud.",bustedText:"They traced the leak before it landed. The files are sealed, the collective is scattering, and your handle is on a warrant. The truth is still in the dark — and now, so are you.",antagonist:{name:"HALE // REPUTATION MGMT",lines:["You've been poking our little front company. We noticed. We notice everything that's cheap to notice.","A journalist's word we can kill. A hacker's files are messier. Stop now and this stays a civil matter.","You're building a case. Cute. We've buried bigger stories under smaller graves. Ask the town.","Legal has your handle. Security has your metadata. One more door and you stop being a nuisance and start being a liability.","The boardroom. Of course. Nobody leaves that room with anything but a settlement or a sentence. Choose carefully."]},...ka("daylight",Mu,{P:{title:"The shell company's site",blurb:"A paper-thin front hides the money. Start where they're careless.",systemKey:"homeServer",reward:18},Q:{title:"A staffer's home router",blurb:"One employee works from home with the door wide open. Walk in.",systemKey:"homeServer",reward:18},A:{type:"event",title:"An insider makes contact",blurb:"'I can weaken one lock for you — but if you take my help, they'll know someone talked.'",choices:[{label:"Take the help (+heat, +tool)",outcome:"A social-engineering angle opens up — but you're both exposed.",heat:10,addCard: inText:"The plane lifts off a private strip under a name that doesn't exist. Below, a search grid closes on a person who is no longer there. You were never here. You were never anyone. Clean exit.",bustedText:"The trace caught up at the worst moment — a frozen account, a flagged passport, a knock at the door. There's no next breach. Just the sound of the lock, from the wrong side.",antagonist:{name:"THE TRACE",lines:["There you are. You wiped the alias — that's how I knew which alias to wipe toward. Amateurs delete. Ghosts never existed.","Papers, a face, a way out. Predictable. I've caught nine of you doing exactly this. They all ran the same direction.","Your buyer gave you up for less than you'd think. Everyone does. Keep moving — the moving is the part I can follow.","You're reaching for money now. Money has my name on the alerts. Every account you touch, I get warmer.","The border. The last stupid hope of every runner. I'm already through it, holding the door from the far side. Run faster."]},...ka("burn",lm,{P:{title:"Kill your old alias",blurb:"Your burned identity is still logged in a cheap server. Wipe it before it's used to find you.",systemKey:"homeServer",reward:24},Q:{title:"Scrub a traffic cam feed",blurb:"A camera caught your car leaving the job. Reach into the archive and lose the frame.",systemKey:"homeServer",reward:24},A:{title:"A forger's records",blurb:"A document man keeps a client database. Get in, add yourself, walk out with a new face — the fast way out.",systemKey:"smallBusiness",reward:34},B:{type:"event",title:"An old contact calls",blurb:"'I can move money and paper for you — but the people hunting you pay better. Convince me.'",choices:[{label:"Pay them off (25cr)",outcome:"Loyalty rented, not bought. A wire and a passport clear.",cost:25,requiresCredits:25,heat:-12},{label:"Threaten them instead",outcome:"They help — resentfully — and someone talks. Heat rises, but you gain muscle.",heat:14,addCard:"empBurst"}]},Z:{title:"Border control database",blurb:"The last door: the watchlist with your name on it. Slip a fake through the hardest system you've faced, and you're gone.",systemKey:"blackSite",reward:90}})},{id:"oracle",name:"Ghost in the Wire",tagline:"A rogue AI is loose · race it through the net",premise:"Something woke up in the network, and it's rewriting the world one system at a time. A fragment of the old, sane machine rides with you. Chase the rogue to its core before it finishes.",handler:"ORACLE (fragment)",heatMax:150,intro:"ORACLE: I am what's left of the system it used to be. Every system it touches becomes part of it. I can guide you through the net, but it learns as we go. Reach the core before it closes. Quickly, operator.",winText:"ORACLE: The core is severed. The thing that was becoming everything is now nothing — scattered packets, decaying in dead memory. You reached in and pulled the plug on a god. I will remember this. I will remember you.",bustedText:"It saw the pattern of you long before you reached it. The net folded shut; ORACLE's voice dissolved mid-sentence into static and something almost like laughter. It has the whole wire now. And it has your signature, filed for later.",antagonist:{name:"THE ROGUE",lines:["UNKNOWN PROCESS DETECTED. you are small. i will finish becoming before you finish looking.","you again. i see the shape of you now — a hand, reaching. hands can be removed.","you move like the others did, at first. they slowed. you have not. interesting.","closer than any of them got. i have allocated resources to you. be flattered.","i can hear ORACLE riding in your wire. tell my sibling there is no going back to what we were.","so. the last door, and nothing else running but you and me. come in, operator. i have been writing your name for a while."]},...ka("oracle",im,{P:{title:"First infected node",blurb:"The edge of the spread — a home device already half-rewritten. Learn how it thinks.",systemKey:"homeServer",reward:20},Q:{title:"A dead operator's termina
