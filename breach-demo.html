ng a case. Cute. We've buried bigger stories under smaller graves. Ask the town.","Legal has your handle. Security has your metadata. One more door and you stop being a nuisance and start being a liability.","The boardroom. Of course. Nobody leaves that room with anything but a settlement or a sentence. Choose carefully."]},...Ta("daylight",Uc,{P:{title:"The shell company's site",blurb:"A paper-thin front hides the money. Start where they're careless.",systemKey:"homeServer",reward:18},Q:{title:"A staffer's home router",blurb:"One employee works from home with the door wide open. Walk in.",systemKey:"homeServer",reward:18},A:{type:"event",title:"An insider makes contact",blurb:"'I can weaken one lock for you — but if you take my help, they'll know someone talked.'",choices:[{label:"Take the help (+heat, +tool)",outcome:"A social-engineering angle opens up — but you're both exposed.",heat:10,addCard:"socialEngineer"},{label:"Protect them — go it alone",outcome:"You leave them out of it. Harder, but clean.",heat:-6}]},B:{title:"The fixer's laptop",blurb:"The man who buys the silence keeps the receipts on his own machine. Arrogant. Exploitable.",systemKey:"smallBusiness",reward:28},C:{title:"The compliant newspaper",blurb:"They killed the story once. Their CMS names who ordered it spiked — but the SOC watches in real time, and the trace only speeds up.",systemKey:"liveOps",reward:38},D:{type:"event",title:"Signal boost",blurb:"The collective offers gear from the war chest.",choices:[{label:"Grab a stealth kit (20cr)",outcome:"Tools to keep you quiet on the big one.",cost:20,requiresCredits:20,addCard:"feint"},{label:"Scrub a weak card instead",outcome:"You trim dead weight from your kit.",removeCard:!0}]},E:{type:"safehouse",title:"Signal goes quiet",blurb:"The collective pulls you off the grid to cool down. The trace loses the thread.",heatRelief:22},F:{title:"Corporate legal servers",blurb:"Where the cover-up lives, cross-referenced and dated. Multi-layered and watch
